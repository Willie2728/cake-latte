    <g fill="none" stroke="url(#kinetic)" stroke-width="15">
      <rect x="119" y="297" width="155" height="205" rx="40" transform="rotate(-25 119 297)"/>
      <rect x="181" y="254" width="170" height="230" rx="44" transform="rotate(-12 181 254)"/>
