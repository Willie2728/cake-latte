    <text x="567" y="480" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="8">BY VERLORAY AI OS</text>
    <line x1="566" y1="525" x2="1115" y2="525" stroke="#151723" stroke-width="2" opacity=".18"/>
    <text x="566" y="584" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" letter-spacing=".3">Intelligence, beautifully orchestrated.</text>
