<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cake-Latte logo concept one, Orbital Pour</title>
  <desc id="desc">An orbital C mark with a warm central spark, Cake-Latte by Verloray AI OS, and the tagline Intelligence, beautifully orchestrated.</desc>
  <defs>
